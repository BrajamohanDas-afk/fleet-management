services:
  db:
    image: postgres:16
    container_name: fleet-db
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_pass
    ports:
      - "15432:5432"
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: fleet-redis
    ports:
      - "6379:6379"
    networks:
      - fleet-net

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: fleet-mediamtx
    ports:
      - "8889:8889"
      - "8890:8890"
      - "8554:8554"
      - "8189:8189/tcp"
      - "8189:8189/udp"
      - "1935:1935"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    networks:
      - fleet-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fleet_user:fleet_pass@db:5432/fleet_db
      REDIS_URL: redis://redis:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://fleet_user:fleet_pass@db:5432/fleet_db
      SECRET_KEY: dev-secret-change-me
      ENV: dev
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_PUBLIC_HOST: 172.17.104.142
      MEDIAMTX_RTSP_PORT: "8554"
      MEDIAMTX_HTTP_PORT: "8890"
      MEDIAMTX_API_PORT: "8889"
      DEV_DEVICE_KEY: dev-device-key
      PUBLIC_SHARE_BASE_URL: http://172.17.104.142:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mediamtx:
        condition: service_started
    networks:
      - fleet-net
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleet-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://172.17.104.142:8000/api
    depends_on:
      api:
        condition: service_started
    networks:
      - fleet-net
    volumes:
      - ./frontend:/app
      - /app/node_modules

  protocol-layer:
    build:
      context: ./Protocol_Layer
      dockerfile: Dockerfile
    container_name: fleet-protocol-layer
    environment:
      REDIS_ADDR: redis:6379
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      PORT: "9000"
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_started
      mediamtx:
        condition: service_started
    networks:
      - fleet-net

networks:
  fleet-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.240.20.0/24
          gateway: 10.240.20.1

