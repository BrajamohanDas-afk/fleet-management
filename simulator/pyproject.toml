[project]
name = "fleet-simulator"
version = "0.1.0"
description = "GPS + H.264 dev agent simulator for the fleet dashboard"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "opencv-python-headless",
    "numpy",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
